<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ current_language.dir }}" data-lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}{{ t("dashboard.title") }}{% endblock %} · Devi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
  <script nonce="{{ csp_nonce }}">
    /* Apply the saved theme before the first paint (same storage key as main.js). */
    (function () {
      try {
        var saved = localStorage.getItem("devi-theme");
        if (saved === "light" || saved === "dark") { document.documentElement.setAttribute("data-theme", saved); }
      } catch (e) { /* storage can be unavailable */ }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
  <a class="skip" href="#main" data-i18n="dashboard.nav.skip">{{ t("dashboard.nav.skip") }}</a>
  {% include "dashboard/_topbar.html" %}

  <main id="main">
    {% block main %}{% endblock %}
  </main>

  {% include "dashboard/_footer.html" %}

  <script type="application/json" id="i18n-data">{{ catalogs | json_script }}</script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
